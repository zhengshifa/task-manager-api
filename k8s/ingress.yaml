# Envoy Gateway resources (Gateway API) replacing the former nginx Ingress.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
  labels:
    app.kubernetes.io/name: task-manager-api
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: task-manager-api
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager-api
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-manager-api
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager-api
spec:
  parentRefs:
    - name: task-manager-api
      namespace: task-manager
  hostnames:
    - task-manager.local
    - demo.mystock.top
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: task-manager-api
          port: 8080
