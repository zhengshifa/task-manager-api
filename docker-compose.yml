services:
  task-manager-api:
    build: .
    image: task-manager-api:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
